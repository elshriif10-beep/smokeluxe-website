<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMOKELUXE Reviews Admin</title><style>body{font-family:Arial,sans-serif;max-width:750px;margin:40px auto;padding:20px;background:#101010;color:white}input,button{padding:12px;border-radius:8px;border:0;margin:5px}input{width:65%}button{cursor:pointer;background:#31c48d;color:#111}button.reject{background:#f88}article{padding:18px;background:#252525;margin:12px 0;border-radius:12px}small{color:#aaa}</style><h1>SMOKELUXE Reviews</h1><p>Enter your private admin password to review submissions.</p><input type="password" id="password" placeholder="Admin password"><button onclick="load()">Load reviews</button><p id="status"></p><h2>Pending reviews</h2><section id="pending"></section><h2>Published reviews</h2><section id="published"></section><script>
const api='/.netlify/functions/reviews-admin';const pass=()=>document.getElementById('password').value;const status=t=>document.getElementById('status').textContent=t;
async function call(method,body){const r=await fetch(api,{method,headers:{'x-admin-password':pass(),'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const node=(tag,txt)=>{let n=document.createElement(tag);n.textContent=txt;return n};
async function load(){try{status('Loading...');const data=await call('GET');const pending=document.getElementById('pending');const published=document.getElementById('published');pending.replaceChildren();published.replaceChildren();for(const item of data.pending){const box=node('article','');box.append(node('strong',item.name+' — '+item.rating+'/5'),node('p',item.review));for(const action of ['approve','reject']){const b=node('button',action==='approve'?'Approve':'Reject');if(action==='reject')b.className='reject';b.onclick=async()=>{if(!confirm(action+' this review?'))return;try{await call('POST',{action,id:item.id});await load()}catch(e){status(e.message)}};box.append(b)}pending.append(box)}for(const item of data.approved){const box=node('article','');box.append(node('strong',item.name+' — '+item.rating+'/5'),node('p',item.review));published.append(box)}status('Loaded '+data.pending.length+' pending reviews.')}catch(e){status(e.message)}}
</script></html>
